<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - temporary.fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Departure+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --white: #ffffff;
    --off-white: #f9f9f8;
    --black: #111110;
    --gray-text: #888885;
    --gray-light: #e8e8e6;
    --gray-mid: #c4c4c0;
    --accent: #0A2BF5;
    --serif: 'Instrument Serif', Georgia, serif;
    --mono: 'Departure Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Helvetica Neue', sans-serif;
    --rule: 1px solid var(--gray-light);
    --pad: 1.5rem;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; scroll-behavior: smooth; }
  body { background: var(--white); color: var(--black); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 1.1rem var(--pad); background: var(--white); border-bottom: var(--rule);
  }
  .nav-logo { font-size: 0.8rem; color: var(--black); }
  .nav-links { display: flex; flex-direction: row; align-items: baseline; gap: 1.5rem; list-style: none; }
  .nav-links a { font-size: 0.8rem; color: var(--black); transition: color 0.15s; }
  .nav-links a:hover { color: var(--accent); }
  .nav-dropdown { position: relative; }
  .nav-dropdown-menu {
    display: none; position: absolute; top: 100%; left: 0;
    background: var(--white); border: var(--rule); min-width: 140px;
    padding: 0.5rem 0; z-index: 200; margin-top: 0.5rem;
  }
  .nav-dropdown:hover .nav-dropdown-menu { display: block; }
  .nav-dropdown-menu a { display: block; padding: 0.4rem 1rem; font-size: 0.75rem; color: var(--black); }
  .nav-dropdown-menu a:hover { color: var(--accent); }
  .nav-dropdown > a::after { content: ' -'; font-size: 0.6rem; color: var(--gray-text); }
  .page { padding-top: 80px; }
  .hero { padding: 4rem var(--pad) 3rem; border-bottom: var(--rule); }
  .hero-label { font-family: var(--mono); font-size: 0.65rem; color: var(--gray-text); display: block; margin-bottom: 1.5rem; }
  .hero-title { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3rem); font-weight: 400; font-style: italic; line-height: 1.1; margin-bottom: 1rem; }
  .hero-sub { font-size: 0.9rem; color: var(--gray-text); line-height: 1.7; max-width: 560px; }
  .section { border-bottom: var(--rule); padding: 3rem var(--pad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; }
  .card { border: var(--rule); cursor: pointer; transition: border-color 0.15s; background: var(--white); }
  .card:hover { border-color: var(--accent); }
  .card-photo { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: var(--off-white); }
  .card-photo-placeholder { width: 100%; aspect-ratio: 1/1; background: var(--off-white); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 2rem; font-style: italic; color: var(--gray-mid); }
  .card-body { padding: 1rem; border-top: var(--rule); }
  .card-name { font-size: 0.95rem; font-weight: 500; color: var(--black); margin-bottom: 0.2rem; }
  .card-role { font-family: var(--mono); font-size: 0.6rem; color: var(--gray-text); margin-bottom: 0.5rem; }
  .card-descriptor { font-size: 0.82rem; color: var(--gray-text); line-height: 1.5; }
  .card-more { font-family: var(--mono); font-size: 0.58rem; color: var(--accent); margin-top: 0.6rem; display: block; }
  .empty-state { grid-column: 1/-1; padding: 3rem; text-align: center; border: 1px dashed var(--gray-light); }
  .empty-state p { font-family: var(--mono); font-size: 0.65rem; color: var(--gray-text); }
  .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(17,17,16,0.6); align-items: center; justify-content: center; padding: 2rem; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--white); max-width: 560px; width: 100%; border: var(--rule); max-height: 90vh; overflow-y: auto; position: relative; }
  .modal-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 0.65rem; color: var(--gray-text); padding: 0.25rem 0.5rem; }
  .modal-close:hover { color: var(--black); }
  .modal-header { display: flex; gap: 1.25rem; align-items: flex-start; padding: 1.5rem; border-bottom: var(--rule); }
  .modal-photo { width: 80px; height: 80px; object-fit: cover; flex-shrink: 0; }
  .modal-photo-placeholder { width: 80px; height: 80px; flex-shrink: 0; background: var(--off-white); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 1.5rem; font-style: italic; color: var(--gray-mid); }
  .modal-name { font-family: var(--serif); font-size: 1.3rem; font-style: italic; margin-bottom: 0.25rem; }
  .modal-role { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); margin-bottom: 0.5rem; }
  .modal-descriptor { font-size: 0.88rem; color: var(--gray-text); line-height: 1.6; }
  .modal-body { padding: 1.5rem; }
  .modal-bio { font-size: 0.93rem; line-height: 1.8; color: var(--black); margin-bottom: 1.25rem; white-space: pre-line; }
  .modal-links { display: flex; flex-wrap: wrap; gap: 0.75rem; padding-top: 1rem; border-top: var(--rule); }
  .modal-link { font-family: var(--mono); font-size: 0.6rem; color: var(--black); border: var(--rule); padding: 0.4rem 0.75rem; transition: border-color 0.15s, color 0.15s; }
  .modal-link:hover { border-color: var(--accent); color: var(--accent); }
  footer { display: flex; justify-content: space-between; align-items: baseline; padding: 1.1rem var(--pad); border-top: var(--rule); }
  .footer-name { font-size: 0.8rem; color: var(--black); }
  .footer-note { font-family: var(--mono); font-size: 0.6rem; color: var(--gray-text); display: flex; gap: 1.5rem; }
  .footer-note a { color: var(--gray-text); border-bottom: 1px solid var(--gray-light); }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } .modal-backdrop { padding: 1rem; } footer { flex-direction: column; gap: 0.75rem; } }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">temporary.fund</a>
  <ul class="nav-links">
    <li><a href="index.html#mission">Mission</a></li>
    <li><a href="index.html#how">How It Works</a></li>
    <li class="nav-dropdown">
      <a href="#">People</a>
      <div class="nav-dropdown-menu">
        <a href="team.html">Team</a>
        <a href="advisors.html">Advisors</a>
      </div>
    </li>
    <li><a href="index.html#submit">Join Waitlist</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>
<div class="page">
  <div class="hero">
    <span class="hero-label">People</span>
    <h1 class="hero-title">Team</h1>
    <p class="hero-sub">The people building temporary.fund.</p>
  </div>
  <div class="section">
    <div id="team-grid" class="grid">
      <div class="empty-state"><p>Loading...</p></div>
    </div>
  </div>
</div>
<footer>
  <span class="footer-name">temporary.fund</span>
  <span class="footer-note">
    <a href="eligibility.html">Eligibility</a>
    <a href="privacy.html">Privacy</a>
    <a href="legal.html">Legal</a>
  </span>
</footer>
<div class="modal-backdrop" id="modal" onclick="closeModalOnBackdrop(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">close -</button>
    <div class="modal-header">
      <div id="modal-photo-wrap"></div>
      <div>
        <div class="modal-name" id="modal-name"></div>
        <div class="modal-role" id="modal-role"></div>
        <div class="modal-descriptor" id="modal-descriptor"></div>
      </div>
    </div>
    <div class="modal-body">
      <p class="modal-bio" id="modal-bio"></p>
      <div class="modal-links" id="modal-links"></div>
    </div>
  </div>
</div>
<script>

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function renderGrid(people, containerId) {
  const grid = document.getElementById(containerId);
  if (!people || people.length === 0) {
    grid.innerHTML = '<div class="empty-state"><p>No members added yet.</p></div>';
    return;
  }
  grid.innerHTML = people.map(p => {
    const safe = JSON.stringify(p).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    return `<div class="card" onclick='openModal(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
      ${p.photo
        ? `<img class="card-photo" src="${p.photo}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
           <div class="card-photo-placeholder" style="display:none">${initials(p.name)}</div>`
        : `<div class="card-photo-placeholder">${initials(p.name)}</div>`}
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-role">${p.role}</div>
        ${p.descriptor ? `<div class="card-descriptor">${p.descriptor}</div>` : ''}
        ${(p.bio || (p.links && p.links.length)) ? '<span class="card-more">View profile -></span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function openModal(p) {
  const photoWrap = document.getElementById('modal-photo-wrap');
  photoWrap.innerHTML = p.photo
    ? `<img class="modal-photo" src="${p.photo}" alt="${p.name}" onerror="this.outerHTML='<div class=modal-photo-placeholder>${initials(p.name)}</div>'">`
    : `<div class="modal-photo-placeholder">${initials(p.name)}</div>`;
  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-role').textContent = p.role;
  document.getElementById('modal-descriptor').textContent = p.descriptor || '';
  document.getElementById('modal-bio').textContent = p.bio || '';
  document.getElementById('modal-bio').style.display = p.bio ? 'block' : 'none';
  const linksEl = document.getElementById('modal-links');
  if (p.links && p.links.length) {
    linksEl.style.display = 'flex';
    linksEl.innerHTML = p.links.map(l => `<a class="modal-link" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
  } else {
    linksEl.style.display = 'none';
  }
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOnBackdrop(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

fetch('people.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => renderGrid(data.team || [], 'team-grid'))
  .catch(() => renderGrid([], 'team-grid'));
</script>
</body>
</html>
